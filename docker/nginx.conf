server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json
             application/manifest+json image/svg+xml;

  # .webmanifest is missing from nginx's stock mime.types.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # Entry points the service worker update flow depends on: always revalidate.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js      { add_header Cache-Control "no-cache"; }
  location = /env.js     { add_header Cache-Control "no-cache"; }

  # Content-hashed bundles: cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /healthz {
    return 200 "ok\n";
  }

  # SPA fallback (mirrors the workbox navigateFallback).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
