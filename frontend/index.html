<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2e2e32" media="(prefers-color-scheme: dark)" />
    <!-- Applies the stored theme and accent before first paint so a dark-mode reload
         never flashes white. Keep in sync with src/lib/theme.js. -->
    <script>
      (function () {
        var stored = localStorage.getItem("theme");
        var dark =
          stored === "dark" || stored === "light"
            ? stored === "dark"
            : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        var accent = localStorage.getItem("accent");
        if (accent && accent !== "blue") document.documentElement.dataset.accent = accent;
      })();
    </script>
    <!-- Runtime config (Docker overwrites this file at container start). A
         classic script so it executes before the deferred module bundle
         reads window.__APP_CONFIG__. -->
    <script src="/env.js"></script>
    <!-- iOS ignores manifest icons; it needs an explicit apple-touch-icon. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Workout Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
